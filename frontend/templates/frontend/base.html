{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="{% block viewport %}width=device-width, initial-scale=1.0, maximum-scale=5.0{% endblock %}">
  <title>{% block title %}New Tractors{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Plataforma de máquinas e equipamentos New Tractors.{% endblock %}">
  <meta name="theme-color" content="#102E26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="New Tractors">

  <!-- Google Fonts: Manrope (Headings) + Inter (Body/Inputs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'frontend/css/tokens.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
