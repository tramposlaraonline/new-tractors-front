<!-- =========================================
     POPUP MODAL DE SUCESSO (ACESSO AUTORIZADO)
     Usado no login e no cadastro (que já entra logado).
     ========================================= -->
<div id="authSuccessModal" class="auth-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="authModalTitle" aria-hidden="true">
  <div class="auth-modal-card" tabindex="-1">
    <div class="auth-modal-icon-wrapper">
      <svg class="auth-modal-icon-center" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="9 12 11.5 14.5 15.5 9.5"/>
      </svg>
      <div class="auth-modal-shield-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
    </div>

    <h3 id="authModalTitle" class="auth-modal-title">Acesso Autorizado!</h3>
    <p class="auth-modal-message">Suas credenciais foram confirmadas com sucesso. Redirecionando para o seu painel...</p>

    <div class="auth-modal-progress-track">
      <div id="authProgressBar" class="auth-modal-progress-bar"></div>
    </div>

    <div class="auth-modal-status">
      <div class="auth-modal-spinner" aria-hidden="true"></div>
      <span>Carregando dados...</span>
    </div>
  </div>
</div>
